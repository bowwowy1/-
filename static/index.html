<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>다큐멘터리 숏츠 소스 생성기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>다큐멘터리 숏츠 소스 생성기</h1>
      <p class="subtitle">주제만 입력하면 대본 + 씬별 이미지/영상 소스를 생성합니다. 최종 편집·자막은 직접 진행하세요.</p>
    </header>

    <main class="app-main">
      <section class="control-panel">
        <label for="topic-input">주제 키워드</label>
        <input id="topic-input" type="text" placeholder="예: 심해 생물의 생존 전략" maxlength="200" />
        <button id="generate-btn">대본 + 소스 생성하기</button>

        <div id="progress-wrap" class="progress-wrap hidden">
          <div class="progress-stage" id="progress-stage">대기 중</div>
          <div class="progress-bar-outer">
            <div class="progress-bar-inner" id="progress-bar-inner"></div>
          </div>
          <div class="progress-percent" id="progress-percent">0%</div>
        </div>

        <div id="error-box" class="error-box hidden"></div>

        <a id="download-link" class="download-btn hidden" download>전체 소스 ZIP 다운로드</a>
      </section>

      <section class="result-panel">
        <div id="script-box" class="script-box hidden">
          <h2 id="script-title"></h2>
          <p id="script-full" class="script-full"></p>
          <audio id="narration-audio" controls class="narration-audio hidden"></audio>
        </div>

        <div id="scene-grid" class="scene-grid"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
