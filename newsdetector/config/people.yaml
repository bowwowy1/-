# 인물 명단 (역할군별)
# 각 인물 필드: name, role, position, weight(기본 1.0), verified(false)
# 2단계에서 검색으로 이름·직책을 검증한 뒤 verified 를 true 로 바꾼다.
# 특히 2026년 6월 지방선거 당선자 명단은 2단계에서 반드시 검색으로 검증한다.

# 주인공
protagonist:
  - name: 이재명
    role: protagonist
    position: 대통령
    weight: 1.0
    verified: false

# 분신 (작은 이재명으로 그리는 인물들)
proxies:
  # 여권 광역단체장
  - name: 김상욱
    role: proxy
    position: 울산광역시장
    weight: 1.0
    verified: false
  - name: 전재수
    role: proxy
    position: 부산광역시장
    weight: 1.0
    verified: false
  - name: 우상호
    role: proxy
    position: 강원도지사
    weight: 1.0
    verified: false
  # 대통령실
  - name: 강훈식
    role: proxy
    position: 대통령실
    weight: 1.0
    verified: false
  # 내각
  - name: 구윤철
    role: proxy
    position: 내각
    weight: 1.0
    verified: false

