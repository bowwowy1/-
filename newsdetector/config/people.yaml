# 인물 명단 (역할군별)
# 각 인물 필드: name, role, position, weight(기본 1.0), verified, source(선택), notes(선택)
# 2026년 6월 3일 제9회 전국동시지방선거 결과를 반영했다. 민주당 12곳, 국민의힘 4곳.
# 출처: 연합뉴스, 서울신문, 시사IN 인포그래픽, MBC, 쿠키뉴스 등.

# 주인공
protagonist:
  - name: 이재명
    role: protagonist
    position: 대통령
    weight: 1.0
    verified: true

