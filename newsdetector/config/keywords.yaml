# 관심 키워드 목록 (4단계 scorer.py 가 페어링 판정과 카테고리 매칭에 사용)
# 형태소 분석기를 쓰지 않고, 여기 등록된 키워드가 기사 제목·본문에 나올 때만 대상으로 삼는다.
# A/B 기사에 공통으로 등장하는 키워드가 "공통 대상 키워드"가 되고, 개수 × 5점(최대 25)이 페어링 강도에 들어간다.

