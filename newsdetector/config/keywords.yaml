# 프레임 감지 (프레임 보너스 규칙 4-5 에 해당)
frames:
  comparison:
    label: 비교형 프레임
    bonus: 10
    triggers:
      - 와 달리
      - 과 달리
      - 전임
      - 윤석열 때는
      - 윤석열 때
      - 비교되는
      - 그동안 못 했던
  mystery:
    label: 미스터리 프레임
    bonus: 15
    triggers:
      - 왜 지금
      - 이 타이밍
      - 이 시점에
      - 돌연
      - 갑자기
      - 하필
