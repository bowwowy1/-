# 보너스·감점 규칙 (4단계 scorer.py 가 최종 점수에 반영)
modifiers:
  - id: comparison_frame
    label: 비교형 프레임
    delta: +10
    description: '"~와 비교되는 이대통령" 같은 비교 구도.'
    evidence:
      - title_summary: 윤석열 비교 유엔연설
        views: 330000
        multiplier: 5.8
      - title_summary: 최태원·김승연 비교
        views: 270000
        multiplier: 5.7

  - id: mystery_timing
    label: 여권 이슈의 미스터리 프레임
    delta: +15
    description: '"이 타이밍에 왜?" 같은 미스터리 훅. 인사·권력 이동 카테고리에 자주 붙는다.'
    evidence:
      - title_summary: 강훈식 사의설
        views: 2010000
        multiplier: 40.5

  - id: solo_person_no_lee
    label: 이재명 연결 없는 단독 인물
    delta: -30
    description: 이재명 또는 분신과 연결되지 않은 단독 인물 소재는 감점.
