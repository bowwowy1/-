# 카테고리 서열과 초기 점수
# 필드: id, name, rank, score, evidence, period_weight, keywords
# 근거: 정치한줄 썸네일 약 150개의 조회수와 채널 평균 대비 배수.
# period_weight 는 시기 가중치이며 기본 1.0, 특정 시기(예: 지방선거 직후)에 상향한다.

