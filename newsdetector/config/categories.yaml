    name: 인사·권력 이동
    rank: 1
    score: 100
    period_weight: 1.0
    keywords:
      - 임명
      - 교체
      - 사의
      - 이 타이밍에 왜
    evidence:
      - title_summary: 강훈식 사의설 (타이밍)
        views: 2010000
        multiplier: 40.5
      - title_summary: 구윤철 교체
        views: 1380000
