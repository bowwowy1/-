# 네이버 뉴스 검색 쿼리 목록 (5단계 collector 가 사용)
# 세 가지 방식으로 조합했다.
#   (1) 인물 기반: 주인공/분신 인물명 × 충돌 동사 (질타/지시/사의/경질/임명/순방)
#   (2) 인물+악역: 분신 인물명 × 악역 유형 대표어
#   (3) 키워드 단독: 사건성 키워드 단독 검색
# 총 47개. 필요시 여기만 손보면 collector.py 를 고칠 필요 없다.

queries:
  # ── (1) 인물 기반: 이재명 대통령 ──
  - 이재명 국무회의
  - 이재명 업무보고
  - 이재명 지시
  - 이재명 질타
  - 이재명 순방
  - 이재명 임명

  # ── (1) 인물 기반: 여권 광역단체장 ──
  - 김상욱 시의회
  - 김상욱 예산
  - 우상호 강원
  - 전재수 부산
  - 박찬대 인천
  - 추미애 경기
  - 오세훈 서울
  - 이원택 전북
  - 민형배 광주

  # ── (1) 인물 기반: 대통령실·내각 (사의·교체 이슈) ──
  - 강훈식 사의
  - 강훈식 대통령실
  - 구윤철 교체
  - 구윤철 경질
  - 이형일 임명

  # ── (2) 인물+악역 조합 ──
  - 이재명 공무원
  - 이재명 카르텔
  - 이재명 도로공사
  - 이재명 농협
  - 이재명 국민의힘
  - 전재수 공무원
  - 김상욱 국민의힘
  - 추미애 지방의회

  # ── (3) 키워드 단독: 사건성 이슈 ──
  - 휴게소 감사
  - 도성회
  - 도로공사 카르텔
  - 농협 갑질
  - 축구협회 비리
  - 공항공사 감사
  - 공무원 지시 불이행
  - 지방의회 부결
  - 시의회 예산 삭감
  - 카르텔 적발
  - 참교육
  - 대통령실 사의
  - 개각
  - 방산 수출
  - 원전 계약
  - 순방 성과
  - 조중동
