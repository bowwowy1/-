# 테스트 전용 templates.yaml
# 프로덕션 config/templates.yaml 의 실제 값과는 별개로,
# fixture 대본의 길이에 맞춰 잡은 테스트용 length 값이다.
# 분량 기준은 프로덕션과 같은 공백 제외(count_mode: no_spaces)로 통일했다.
# (good.md 공백 제외 359자, bad_6.md 150자 → 340~400 범위가 good 만 통과시킨다)

length:
  status: confirmed
  count_mode: no_spaces
  target_min: 340
  target_max: 400
  median: 370
  speech_rate: 5.34
  estimated_seconds:
    min: 63.7
    max: 74.9

fixed_phrases:
  opening: "이거 사실이야?"
  transition: "무슨 내용인지 바로 알려줄게"
  twist_hook: "이건 몰랐지?"
  mechanism_hook: "왜냐고?"
  cta: "~면 구독과 좋아요 부탁하고 여러분의 생각을 댓글로 남겨주세요"
